name: Contact Worker checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contact
      - run: npm run contact:check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:contact-flow
